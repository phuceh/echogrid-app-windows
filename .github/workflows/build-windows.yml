name: Build Windows App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install web dependencies
        run: npx expo install react-dom react-native-web @expo/metro-runtime

      - name: Build web export
        run: npx expo export --platform web

      - name: Fix paths and viewport
        run: node fix-viewport.js

      - name: Create self-signed certificate
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=2C0773BF-7A71-4EB5-9B26-1A0A8550E6D7" -KeyUsage DigitalSignature -FriendlyName "Echo Grid" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "echogrid123" -Force -AsPlainText
          Export-PfxCertificate -cert $cert -FilePath "echogrid.pfx" -Password $pwd
          Export-Certificate -cert $cert -FilePath "echogrid.cer"
        shell: powershell

      - name: Build Windows app
        run: npx electron-builder --win appx --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Sign appx with Windows signtool
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          Write-Host "Found signtool at: $signtool"
          & $signtool sign /fd SHA256 /f echogrid.pfx /p echogrid123 /tr http://timestamp.digicert.com /td SHA256 "release\Echo Grid 1.0.1.appx"
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-grid-windows
          path: |
            release/*.appx
            echogrid.cer
